name: Release VSIX Workflow
on:
  release:
    types: [published]
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CARGO_INCREMENTAL: 0
jobs:
  check-versions-match:
    name: Check versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          submodules: 'true'
      - name: Install jq
        run: sudo apt-get install jq
      - run: make check_versions_match
  upload-vsix-release:
    name: Upload VSIX Release
    runs-on: ubuntu-latest
    needs:
      - check-versions-match
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          submodules: 'true'
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # ratchet:actions-rs/toolchain@v1
        with:
          toolchain: '1.98.1'
          target: wasm32-unknown-unknown
          override: true
          profile: minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # ratchet:Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.114 --locked
      - name: Build rust wasm
        run: make rust_build_wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install -r --frozen-lockfile
      - name: Build extension
        run: pnpm run build_extension
      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # ratchet:softprops/action-gh-release@v3.0.3
        with:
          files: ./js/packages/quary-extension/quary-*.vsix
      - run: pnpx vsce publish --packagePath $(find ./js/packages/quary-extension/quary-*.vsix)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
